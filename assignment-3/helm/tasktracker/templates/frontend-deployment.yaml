apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.frontendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
      tier: frontend
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: {{ include "tasktracker.image" (dict "root" . "tier" "frontend") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef: {name: {{ include "tasktracker.configName" . }}, key: BACKEND_URL}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
