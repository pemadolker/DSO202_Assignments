{{- /*
secret.yaml: only created when no existingSecret is given.
DB_* and POSTGRES_* get the same values, like A1.
Note: whatever is passed here is also stored in Helm's release record.
*/}}
{{- if not .Values.credentials.existingSecret }}
{{- $user := required "credentials.user must be set (or use credentials.existingSecret)" .Values.credentials.user }}
{{- $pass := required "credentials.password must be set (or use credentials.existingSecret)" .Values.credentials.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasktracker.secretName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ $user | b64enc | quote }}
  DB_PASSWORD: {{ $pass | b64enc | quote }}
  POSTGRES_USER: {{ $user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $pass | b64enc | quote }}
{{- end }}
