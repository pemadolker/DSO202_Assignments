# Same values and reasoning as A1 (sized for one replica of each tier
# plus a rolling update). The prod overlay raises them with a patch.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "8"
    persistentvolumeclaims: "2"
    services.nodeports: "1"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 500m
        memory: 512Mi
