# =============================================================================
# File        : cluster/kind-cluster.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.1 - cluster setup (Practical 1)
# Purpose     : The kind cluster for this assignment, from Practical 1 / A1.
#               One control-plane node (the single-node fallback), because
#               Argo CD (7 Pods), Sealed Secrets and two copies of the Task
#               Tracker already use a lot of memory on a laptop. The A2 ports
#               80/443 and the ingress-ready label are left out on purpose:
#               no ingress controller is installed in this assignment.
# Create with : kind create cluster --name dso202-gitops --config cluster/kind-cluster.yaml
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Dev frontend NodePort (environments/dev/values.yaml) -> http://localhost:30080.
      # Staging (30081) is not mapped on purpose and is reached with
      # kubectl port-forward (brief, section 6.3).
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
