# =============================================================================
# File        : environments/dev/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - Helm values; Unit IV 4.3.1 - Application CRDs
# Purpose     : Everything that is different in dev. Read by the
#               tasktracker-dev Application from the tip of main, so a merge
#               that changes this file is deployed to dev within about a
#               minute. Only values that really differ are written here.
# =============================================================================
environment: dev

# Image tags, exact and pinned. A release is a change to these lines.
images:
  frontend:
    tag: "1.0"
  backend:
    tag: "1.0"
  database:
    tag: "1.0"

# The Secret created by the Sealed Secrets controller from
# platform/dev/tasktracker-credentials.sealed.yaml.
credentials:
  existingSecret: tasktracker-credentials

# One replica per tier to save memory on the laptop (brief, section 3.3).
backend:
  replicaCount: 1

frontend:
  replicaCount: 1
  service:
    # Mapped to the host by cluster/kind-cluster.yaml: http://localhost:30080
    nodePort: 30080
