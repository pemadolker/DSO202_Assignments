# =============================================================================
# File        : cluster/kind-cluster.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.1 - cluster setup (Practical 1)
# Purpose     : The kind cluster used for this assignment, same as Practical 1
#               and Assignment 1. One node (the single-node setup), because
#               Argo CD, Sealed Secrets and two copies of the Task Tracker
#               already use a lot of memory on a laptop.
# Create with : kind create cluster --name dso202-gitops --config cluster/kind-cluster.yaml
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      # Dev frontend NodePort (environments/dev/values.yaml) to
      # http://localhost:30080. Staging (30081) is not mapped on purpose and is
      # reached with kubectl port-forward.
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
