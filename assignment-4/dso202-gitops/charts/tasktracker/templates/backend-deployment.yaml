# =============================================================================
# File        : charts/tasktracker/templates/backend-deployment.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.2 - Deployments; Unit IV 4.3.2 - sync waves;
#               4.3.3 - health checks
# Purpose     : The Node.js API. Changes from A3: credentials only from
#               existingSecret (C3), extra env from values (C2), readiness
#               probe (C4), wave 1 (C5), progressDeadlineSeconds (C6).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.backendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: backend
  annotations:
    # C5: after the database (wave 0) is Healthy, before the frontend (wave 2).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # C6: a rollout that makes no progress for 120 s is marked failed, so Argo
  # CD shows Degraded after two minutes instead of ten.
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
      tier: backend
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tasktracker.backendName" . }}
      containers:
        - name: api
          # C1: repository and tag both come from values.
          image: {{ include "tasktracker.image" (dict "root" . "tier" "backend") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- range $key := list "DB_HOST" "DB_PORT" "DB_NAME" "APP_PORT" "CORS_ORIGIN" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef: {name: {{ include "tasktracker.configName" $ }}, key: {{ $key }}}
            {{- end }}
            {{- range $key := list "DB_USER" "DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ include "tasktracker.secretName" $ }}, key: {{ $key }}}
            {{- end }}
            # C2: anything in backend.env is added here, no template change.
            {{- with .Values.backend.env }}
            {{- include "tasktracker.extraEnv" . | trim | nindent 12 }}
            {{- end }}
          # C4: /api/status runs "SELECT 1", so the Pod is only Ready when it
          # can actually reach the database.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
