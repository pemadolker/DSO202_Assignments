# =============================================================================
# File        : charts/tasktracker/templates/db-service.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.3 - Services; Unit II 2.1 - StatefulSets
# Purpose     : Headless Service for the database, as in A1 and A2. Gives the
#               StatefulSet Pod a DNS name inside the namespace, with no
#               virtual IP and no outside access.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasktracker.dbName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: database
spec:
  clusterIP: None
  selector:
    {{- include "tasktracker.selectorLabels" . | nindent 4 }}
    tier: database
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
