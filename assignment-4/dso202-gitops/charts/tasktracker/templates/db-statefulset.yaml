# =============================================================================
# File        : charts/tasktracker/templates/db-statefulset.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit II 2.1 - StatefulSets; Unit IV 4.3.2 - sync waves;
#               4.3.3 - health checks
# Purpose     : The PostgreSQL tier. A3 used a Deployment and a PVC; here it is
#               the A2 StatefulSet again, because the brief's project whitelist
#               (Listing 8) names StatefulSet and not PersistentVolumeClaim.
#               The PVC comes from volumeClaimTemplates, so it is created by
#               the StatefulSet controller and Argo CD does not track it.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tasktracker.dbName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: database
  annotations:
    # C5: wave 0. Argo CD waits until this is Healthy (readiness probe below
    # passes) before it applies the backend in wave 1.
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Must be the headless Service, for the stable Pod DNS name.
  serviceName: {{ include "tasktracker.dbName" . }}
  # Plain postgres has no replication, so more than one replica would just be
  # separate databases. Fixed at 1, same as A2.
  replicas: 1
  # RollingUpdate, not OnDelete: Argo CD does not report an OnDelete
  # StatefulSet as Healthy, which would block the next wave.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
      tier: database
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: database
      annotations:
        # The Pod restarts when the ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ include "tasktracker.image" (dict "root" . "tier" "database") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: {{ include "tasktracker.configName" . }}, key: POSTGRES_DB}
            # C3: credentials only from the Secret named by existingSecret.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: {{ include "tasktracker.secretName" . }}, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "tasktracker.secretName" . }}, key: POSTGRES_PASSWORD}
            {{- with .Values.database.env }}
            {{- include "tasktracker.extraEnv" . | trim | nindent 12 }}
            {{- end }}
          # C4: ready only when postgres accepts connections over TCP. During
          # the first start the image runs its init scripts with TCP turned
          # off, so the probe stays false until the real server is up.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          # C7: required by the namespace ResourceQuota.
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Written out in full so the stored object matches Git and Argo CD
        # does not show a difference for defaulted fields.
        volumeMode: Filesystem
        storageClassName: {{ .Values.database.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
  # Deleting the StatefulSet keeps the data (same as A2).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
