# =============================================================================
# File        : charts/tasktracker/templates/backend-serviceaccount.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit II 2.3 - ServiceAccounts
# Purpose     : Own identity for the backend Pods instead of the namespace
#               "default" account (same idea as backend-sa in A2). The backend
#               never calls the Kubernetes API, so no token is mounted and no
#               Role is bound to it. Roles live in the platform layer anyway,
#               because the dso202 project is not allowed to create them.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasktracker.backendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: backend
automountServiceAccountToken: false
