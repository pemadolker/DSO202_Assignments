# =============================================================================
# File        : charts/tasktracker/templates/frontend-service.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.3 - Services
# Purpose     : Requirement C10: the only Service reachable from outside. The
#               type is NodePort and the port number is a value: 30080 in dev
#               (mapped by the kind config), 30081 in staging (not mapped,
#               reached with kubectl port-forward).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasktracker.frontendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "tasktracker.selectorLabels" . | nindent 4 }}
    tier: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      nodePort: {{ required "frontend.service.nodePort must be set in the environment values file (C10)" .Values.frontend.service.nodePort }}
