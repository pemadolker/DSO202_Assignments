# =============================================================================
# File        : charts/tasktracker/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - Helm values
# Purpose     : Defaults only. Everything that is different between dev and
#               staging lives in environments/<env>/values.yaml. Values that
#               must be chosen per environment are left empty here on purpose,
#               and the templates refuse to render until they are set.
# =============================================================================

# dev or staging. Used only as a label. No template checks it (design rule:
# no "if env == dev" anywhere in the chart).
environment: ""

# Requirement C1: repository and tag are values for each tier.
# The tags are empty on purpose: a missing tag stops the render instead of
# silently falling back to something. Tags are set in the environment files.
# pdolker/* are my amd64 rebuilds of the tutor images (approved in A1).
images:
  pullPolicy: IfNotPresent
  frontend:
    repository: pdolker/dso202-frontend
    tag: ""
  backend:
    repository: pdolker/dso202-backend
    tag: ""
  database:
    repository: pdolker/dso202-db
    tag: ""

# Requirement C3: the chart never creates a Secret. The Pods read the
# credentials from this Secret, which the Sealed Secrets controller creates
# from platform/<env>/tasktracker-credentials.sealed.yaml. It must have the
# keys DB_USER, DB_PASSWORD, POSTGRES_USER and POSTGRES_PASSWORD.
credentials:
  existingSecret: ""

database:
  name: taskdb
  port: 5432
  # Requirement C2: extra environment variables for this tier, as NAME: value.
  env: {}
  persistence:
    size: 1Gi
    # kind's default StorageClass.
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

backend:
  replicaCount: 1
  port: 8080
  corsOrigin: "*"
  # Requirement C2: adding a variable to the backend is a values change only.
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  replicaCount: 1
  port: 8080
  env: {}
  service:
    # Requirement C10: NodePort, and the port number is a value per environment.
    type: NodePort
    nodePort: null
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Requirement C6: how long a rollout may take before the Deployment reports
# that it is stuck. Kubernetes default is 600 seconds.
progressDeadlineSeconds: 120

nameOverride: ""
fullnameOverride: ""
