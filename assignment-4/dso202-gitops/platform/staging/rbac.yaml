# =============================================================================
# File        : platform/staging/rbac.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit II 2.3 - RBAC (Role, RoleBinding, ServiceAccount)
# Purpose     : The Assignment 2 read-only access for the namespace: a
#               ServiceAccount, a Role that can only get/list/watch, and the
#               RoleBinding between them, pointed at dso202-staging.
#               These live in the platform layer (C8). The dso202 project
#               cannot create Roles or RoleBindings, so a commit to the chart
#               can never give the workloads more Kubernetes rights.
# Check with  : kubectl auth can-i list pods -n dso202-staging \
#                 --as system:serviceaccount:dso202-staging:readonly-sa
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-sa
  namespace: dso202-staging
  labels:
    app: task-tracker
    dso202/environment: staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-reader
  namespace: dso202-staging
  labels:
    app: task-tracker
    dso202/environment: staging
rules:
  # Secrets are not in the list on purpose: a reader must not be able to
  # read the decrypted credentials.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # statefulsets is new compared to A2, because the database is a
  # StatefulSet in this chart.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-sa-binding
  namespace: dso202-staging
  labels:
    app: task-tracker
    dso202/environment: staging
subjects:
  - kind: ServiceAccount
    name: readonly-sa
    namespace: dso202-staging
roleRef:
  kind: Role
  name: namespace-reader
  apiGroup: rbac.authorization.k8s.io
