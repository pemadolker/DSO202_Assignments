# =============================================================================
# File        : environments/dev/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - Helm values; Unit IV 4.3.1 - Application source
# Purpose     : Only what differs in dev. Read by tasktracker-dev from the tip
#               of main, so a merge that changes this file is deployed to dev
#               within about a minute.
# =============================================================================

# C1: image tags per tier. A release is a change to these lines. Quoted, so
# YAML keeps "1.0" as a string and not the number 1.
images:
  frontend:
    tag: "1.0"
  backend:
    tag: "1.0"
  database:
    tag: "1.0"

# C3: the Secret created by the Sealed Secrets controller from
# platform/dev/tasktracker-credentials.sealed.yaml.
credentials:
  existingSecret: tasktracker-credentials

# One replica per tier to save memory on the laptop.
backend:
  replicaCount: 1

frontend:
  replicaCount: 1
  service:
    # C10: mapped to http://localhost:30080 by cluster/kind-cluster.yaml.
    nodePort: 30080
  # The browser calls this URL, so it must be reachable from the laptop:
  #   kubectl port-forward -n dso202-dev svc/tasktracker-backend 8090:8080
  backendUrl: "http://localhost:8090"
