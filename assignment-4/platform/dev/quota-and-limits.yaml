# =============================================================================
# File        : platform/dev/quota-and-limits.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.3 - ResourceQuota and LimitRange
# Purpose     : The Assignment 2 ResourceQuota and LimitRange for dso202-dev.
#               They are platform objects (C8): the workload chart cannot
#               render them and the dso202 project cannot create them, so a
#               commit to the chart can never raise its own limits.
# Changed from A2:
#   - namespace dso202-assignment-01 -> dso202-dev
#   - services.nodeports "0" -> "1": in A2 the frontend went through the
#     Ingress; here there is no ingress controller and the frontend is a
#     NodePort Service (C10).
# Budget check (requests): db 100m/128Mi + backend 50m/64Mi + frontend
#   25m/32Mi + smoke test 10m/16Mi = 185m/240Mi, inside 500m/512Mi, with room
#   for a rolling update and for Drill 1 (backend scaled to 3).
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
  namespace: dso202-dev
  labels:
    app: task-tracker
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1200Mi
    pods: "8"
    persistentvolumeclaims: "4"
    services.nodeports: "1"
    services.loadbalancers: "0"
---
# Defaults and bounds per container. Every container in the chart states its
# own requests and limits (C7), so the defaults are only a safety net.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: dso202-dev
  labels:
    app: task-tracker
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 500m
        memory: 512Mi
