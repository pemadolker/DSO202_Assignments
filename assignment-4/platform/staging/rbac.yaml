# =============================================================================
# File        : platform/staging/rbac.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit II 2.3 - Kubernetes RBAC
# Purpose     : The Assignment 2 read-only access for dso202-staging: a ServiceAccount,
#               a Role that can only read, and the RoleBinding between them.
#               Platform objects (C8), never rendered by the chart.
# Changed from A2:
#   - namespace dso202-assignment-01 -> dso202-staging
#   - statefulsets added to the readable kinds, because the database is a
#     StatefulSet again in this assignment.
# Secrets are deliberately not readable: the decrypted credentials stay
# hidden from this account.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-sa
  namespace: dso202-staging
  labels:
    app: task-tracker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-reader
  namespace: dso202-staging
  labels:
    app: task-tracker
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-sa-binding
  namespace: dso202-staging
  labels:
    app: task-tracker
subjects:
  - kind: ServiceAccount
    name: readonly-sa
    namespace: dso202-staging
roleRef:
  kind: Role
  name: namespace-reader
  apiGroup: rbac.authorization.k8s.io
