{{- /*
=============================================================================
File        : charts/tasktracker/templates/configmap.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit I 1.2.5 - ConfigMaps; Unit III 3.2 - Helm templates
Purpose     : The non-secret settings of all three tiers (same keys as the A1
              ConfigMap). DB_HOST and the default BACKEND_URL are built from
              the same helpers as the Service names, so they always match.
=============================================================================
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tasktracker.configName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "tasktracker.dbName" . | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  APP_PORT: {{ .Values.backend.port | quote }}
  CORS_ORIGIN: {{ .Values.backend.corsOrigin | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  # Read by the browser, not by a Pod (see frontend.backendUrl in values.yaml).
  BACKEND_URL: {{ .Values.frontend.backendUrl | default (printf "http://%s:%v" (include "tasktracker.backendName" .) .Values.backend.port) | quote }}
