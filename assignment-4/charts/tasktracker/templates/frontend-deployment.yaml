{{- /*
=============================================================================
File        : charts/tasktracker/templates/frontend-deployment.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit I 1.2 - Deployments; Unit IV 4.3.2 - sync waves,
              4.3.3 - health checks
Purpose     : The nginx frontend, sync wave "2": created last, after the
              backend (wave "1") is Healthy.
=============================================================================
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.frontendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: frontend
  annotations:
    # C5
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  # C6
  progressDeadlineSeconds: {{ .Values.frontend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
      tier: frontend
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: frontend
      annotations:
        # BACKEND_URL is written into config.js when the container starts, so
        # a changed ConfigMap must restart the Pod to take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: {{ include "tasktracker.image" (dict "root" . "tier" "frontend") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.configName" . }}
                  key: BACKEND_URL
            {{- with .Values.frontend.env }}
            {{- include "tasktracker.extraEnv" . | trim | nindent 12 }}
            {{- end }}
          # C4: nginx answers on / once config.js has been rendered.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          # C7
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
