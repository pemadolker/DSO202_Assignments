{{- /*
=============================================================================
File        : charts/tasktracker/templates/backend-serviceaccount.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit II 2.3 - ServiceAccounts
Purpose     : The backend Pods run under their own ServiceAccount instead of
              "default" (as backend-sa in A2). The backend never calls the
              Kubernetes API, so no token is mounted and no Role is bound.
              Roles and RoleBindings are platform objects (C8), not chart ones.
=============================================================================
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasktracker.backendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: backend
automountServiceAccountToken: false
