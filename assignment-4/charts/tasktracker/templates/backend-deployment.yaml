{{- /*
=============================================================================
File        : charts/tasktracker/templates/backend-deployment.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit I 1.2 - Deployments; Unit IV 4.3.2 - sync waves,
              4.3.3 - health checks
Purpose     : The Node.js API, sync wave "1": created only after the database
              StatefulSet (wave "0") is Healthy.
=============================================================================
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.backendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: backend
  annotations:
    # C5
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # C6: report a stuck rollout as failed (Degraded in Argo CD) after 120 s.
  progressDeadlineSeconds: {{ .Values.backend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
      tier: backend
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: backend
      annotations:
        # A changed ConfigMap rolls the Pods, because env values are only read
        # when a container starts.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tasktracker.backendName" . }}
      automountServiceAccountToken: false
      containers:
        - name: api
          image: {{ include "tasktracker.image" (dict "root" . "tier" "backend") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- range $key := list "DB_HOST" "DB_PORT" "DB_NAME" "APP_PORT" "CORS_ORIGIN" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.configName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := list "DB_USER" "DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.backend.env }}
            {{- include "tasktracker.extraEnv" . | trim | nindent 12 }}
            {{- end }}
          # C4: /api/status runs "SELECT 1", so the backend is Ready only when it
          # can really reach PostgreSQL. In A1 I left probes out because the
          # backend retries until the database is up; here sync waves and the
          # smoke test depend on "Healthy" meaning "working", so they are needed.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          # C7
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
