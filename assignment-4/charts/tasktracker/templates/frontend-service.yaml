{{- /*
=============================================================================
File        : charts/tasktracker/templates/frontend-service.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit I 1.3 - Services
Purpose     : C10: NodePort Service for the frontend. The port number is a
              value: 30080 in dev (mapped to localhost by the kind config),
              30081 in staging (not mapped, reached with port-forward).
              C9: there is no Ingress template in this chart at all, because
              no ingress controller is installed in this assignment.
=============================================================================
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasktracker.frontendName" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "tasktracker.selectorLabels" . | nindent 4 }}
    tier: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      {{- if eq .Values.frontend.service.type "NodePort" }}
      nodePort: {{ required "frontend.service.nodePort is required for a NodePort Service" .Values.frontend.service.nodePort }}
      {{- end }}
