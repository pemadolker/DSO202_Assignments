# =============================================================================
# File        : charts/tasktracker/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - Helm values; Unit IV 4.3 - GitOps delivery
# Purpose     : Chart defaults only. Everything that differs between dev and
#               staging lives in environments/<env>/values.yaml, which Argo CD
#               passes to the chart as a value file.
#
# Keys that are deliberately left empty (image tags, existingSecret, nodePort)
# have no safe default. The templates use 'required', so the chart refuses to
# render until an environment file sets them. A release is therefore always a
# visible change in an environment file.
# =============================================================================

images:
  # Never 'Always': images may be loaded into kind with 'kind load docker-image'
  # when Docker Hub rate-limits the pull (brief, section 13).
  pullPolicy: IfNotPresent
  # My amd64 rebuilds of the tutor images, approved by the tutor in A1.
  # C1: repository and tag are values for each tier; no tag in any template.
  frontend:
    repository: pdolker/dso202-frontend
    tag: ""
  backend:
    repository: pdolker/dso202-backend
    tag: ""
  database:
    repository: pdolker/dso202-db
    tag: ""

# C3: the chart never renders a Secret. It only refers to one by name. The
# Secret is created in the namespace by the Sealed Secrets controller from the
# SealedSecret in platform/<env>/. It must hold DB_USER, DB_PASSWORD,
# POSTGRES_USER and POSTGRES_PASSWORD.
credentials:
  existingSecret: ""

database:
  name: taskdb
  port: 5432
  storage:
    size: 1Gi
    # Empty means the cluster default StorageClass (kind: "standard").
    storageClass: ""
  # C7: requests and limits on every container (the namespace quota needs them).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # C2: extra environment variables, rendered as plain env entries.
  env: {}

backend:
  replicaCount: 1
  port: 8080
  corsOrigin: "*"
  # C6: a failed rollout is reported as Degraded after 2 minutes, not 10.
  progressDeadlineSeconds: 120
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # C2: adding a backend variable is a values change only, for example
  #   env:
  #     SOME_SETTING: "value"
  env: {}

frontend:
  replicaCount: 1
  port: 8080
  progressDeadlineSeconds: 120
  # The frontend is a static site; its JavaScript runs in the browser and calls
  # BACKEND_URL directly. Empty means the in-cluster backend Service address,
  # which only works from inside the cluster. An environment can set a URL the
  # browser can reach instead (for example a port-forward on localhost).
  backendUrl: ""
  service:
    # C10: NodePort, and the port number is a value per environment.
    type: NodePort
    nodePort: null
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  env: {}

# PostSync smoke test (templates/smoke-test-job.yaml, Listing 13).
smokeTest:
  image:
    repository: busybox
    tag: "1.37"
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

nameOverride: ""
fullnameOverride: ""
